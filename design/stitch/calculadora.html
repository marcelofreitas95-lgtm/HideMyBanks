<body class="bg-surface-container-lowest text-on-surface antialiased min-h-screen flex items-center justify-center p-0 md:p-6 font-body-md select-none">
<!-- iPhone 14 / 15 Dimension Chassis (390px x 844px) -->
<main class="w-full max-w-[390px] h-[844px] bg-surface flex flex-col justify-between relative overflow-hidden shadow-2xl md:rounded-[48px] md:border md:border-surface-container-high">

<!-- Status Bar Hardware Indicators -->
<div class="flex items-center gap-1.5 text-on-surface pr-1">
<span class="material-symbols-outlined text-[16px] leading-none text-on-surface" data-icon="signal_cellular_alt">signal_cellular_alt</span>
<span class="material-symbols-outlined text-[16px] leading-none text-on-surface" data-icon="wifi">wifi</span>
<!-- iOS Accurate Battery Capsule -->
<div class="w-5 h-2.5 rounded-sm border border-on-surface/80 p-0.5 flex items-center ml-0.5 relative">
<div class="h-full w-3 bg-on-surface rounded-[1px]"></div>
<div class="w-0.5 h-1 bg-on-surface/80 absolute -right-1 top-0.5 rounded-r-sm"></div>
</div>
</div>
</div>
<!-- Native Tool App Bar (Discreet, zero indication of vault partition) -->
<div class="w-full py-1.5 flex justify-center items-center">
<h1 class="text-label-md font-label-md font-medium text-tertiary tracking-normal opacity-70">
          Calculadora
        </h1>
</div>
</header>
<!-- Display Area -->
<section class="w-full px-margin flex flex-col justify-end flex-1 pb-4">
<!-- Expression & Secondary Controls Bar -->
<div class="w-full flex items-center justify-between mb-1 min-h-[32px]">
<div class="text-body-md font-body-md text-tertiary-container tracking-tight transition-opacity duration-150" id="history-display"></div>
<!-- Discreet Backspace Trigger -->
<button aria-label="Apagar dígito" class="w-9 h-9 rounded-full flex items-center justify-center text-on-surface-variant hover:text-on-surface active:scale-90 active:bg-surface-container-high transition duration-100 ease-out" id="btn-backspace" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="backspace">backspace</span>
</button>
</div>
<!-- Main Readout Output -->
<div class="w-full overflow-hidden flex justify-end items-baseline">
<div class="text-display-calc-mobile font-display-calc-mobile text-on-surface tracking-tighter text-right select-text transition-all duration-75 overflow-hidden whitespace-nowrap" id="main-display">0</div>
</div>
</section>
<!-- Keypad Matrix 4-Column Grid -->
<section aria-label="Teclado numérico" class="w-full px-margin pb-3 shrink-0">
<div class="grid grid-cols-4 gap-gutter w-full">
<!-- Row 1: Function Controls & Division -->
<button class="h-[70px] rounded-2xl bg-surface-container-highest text-on-surface text-headline-md font-headline-md font-medium active:scale-[0.96] active:bg-surface-bright transition-all duration-75 flex items-center justify-center" id="btn-clear" type="button">AC</button>
<button class="h-[70px] rounded-2xl bg-surface-container-highest text-on-surface text-headline-md font-headline-md font-medium active:scale-[0.96] active:bg-surface-bright transition-all duration-75 flex items-center justify-center" id="btn-negate" type="button">
          ±
        </button>
<button class="h-[70px] rounded-2xl bg-surface-container-highest text-on-surface text-headline-md font-headline-md font-medium active:scale-[0.96] active:bg-surface-bright transition-all duration-75 flex items-center justify-center" id="btn-percent" type="button">
          %
        </button>
<button class="h-[70px] rounded-2xl bg-primary-container text-on-primary-container text-keypad-op font-keypad-op active:scale-[0.96] active:bg-primary transition-all duration-75 flex items-center justify-center" data-op="÷" type="button">
          ÷
        </button>
<!-- Row 2: 7, 8, 9 & Multiplication -->
<button class="h-[70px] rounded-2xl bg-surface-container-high text-on-surface text-keypad-num font-keypad-num active:scale-[0.96] active:bg-surface-variant transition-all duration-75 flex items-center justify-center" data-num="7" type="button">
          7
        </button>
<button class="h-[70px] rounded-2xl bg-surface-container-high text-on-surface text-keypad-num font-keypad-num active:scale-[0.96] active:bg-surface-variant transition-all duration-75 flex items-center justify-center" data-num="8" type="button">
          8
        </button>
<button class="h-[70px] rounded-2xl bg-surface-container-high text-on-surface text-keypad-num font-keypad-num active:scale-[0.96] active:bg-surface-variant transition-all duration-75 flex items-center justify-center" data-num="9" type="button">
          9
        </button>
<button class="h-[70px] rounded-2xl bg-primary-container text-on-primary-container text-keypad-op font-keypad-op active:scale-[0.96] active:bg-primary transition-all duration-75 flex items-center justify-center" data-op="×" type="button">
          ×
        </button>
<!-- Row 3: 4, 5, 6 & Subtraction -->
<button class="h-[70px] rounded-2xl bg-surface-container-high text-on-surface text-keypad-num font-keypad-num active:scale-[0.96] active:bg-surface-variant transition-all duration-75 flex items-center justify-center" data-num="4" type="button">
          4
        </button>
<button class="h-[70px] rounded-2xl bg-surface-container-high text-on-surface text-keypad-num font-keypad-num active:scale-[0.96] active:bg-surface-variant transition-all duration-75 flex items-center justify-center" data-num="5" type="button">
          5
        </button>
<button class="h-[70px] rounded-2xl bg-surface-container-high text-on-surface text-keypad-num font-keypad-num active:scale-[0.96] active:bg-surface-variant transition-all duration-75 flex items-center justify-center" data-num="6" type="button">
          6
        </button>
<button class="h-[70px] rounded-2xl bg-primary-container text-on-primary-container text-keypad-op font-keypad-op active:scale-[0.96] active:bg-primary transition-all duration-75 flex items-center justify-center" data-op="−" type="button">
          −
        </button>
<!-- Row 4: 1, 2, 3 & Addition -->
<button class="h-[70px] rounded-2xl bg-surface-container-high text-on-surface text-keypad-num font-keypad-num active:scale-[0.96] active:bg-surface-variant transition-all duration-75 flex items-center justify-center" data-num="1" type="button">
          1
        </button>
<button class="h-[70px] rounded-2xl bg-surface-container-high text-on-surface text-keypad-num font-keypad-num active:scale-[0.96] active:bg-surface-variant transition-all duration-75 flex items-center justify-center" data-num="2" type="button">
          2
        </button>
<button class="h-[70px] rounded-2xl bg-surface-container-high text-on-surface text-keypad-num font-keypad-num active:scale-[0.96] active:bg-surface-variant transition-all duration-75 flex items-center justify-center" data-num="3" type="button">
          3
        </button>
<button class="h-[70px] rounded-2xl bg-primary-container text-on-primary-container text-keypad-op font-keypad-op active:scale-[0.96] active:bg-primary transition-all duration-75 flex items-center justify-center" data-op="+" type="button">
          +

          0
        </button>
<button class="h-[70px] rounded-2xl bg-surface-container-high text-on-surface text-keypad-num font-keypad-num active:scale-[0.96] active:bg-surface-variant transition-all duration-75 flex items-center justify-center" id="btn-comma" type="button">
          ,
        </button>
<button class="h-[70px] rounded-2xl bg-primary-container text-on-primary-container text-keypad-op font-keypad-op active:scale-[0.96] active:bg-primary transition-all duration-75 flex items-center justify-center" id="btn-equals" type="button">
          =
        </button>
</div>

<!-- Safe Area: Classic iOS Bottom Home Bar Indicator -->

<div class="w-36 h-1 bg-on-surface/30 rounded-full"></div>
</footer>
</main>
<!-- High-fidelity Native Tactile Feedback & Mathematical Logic -->
<script>
    (function () {
      const display = document.getElementById('main-display');
      const history = document.getElementById('history-display');
      const clearBtn = document.getElementById('btn-clear');

      let currentValue = '31415926';
      let previousValue = '2100';
      let currentOperator = null;
      let shouldResetDisplay = false;

      function formatNumber(val) {
        if (!val || val === '0') return '0';
        if (val === '-') return '-';

        const parts = val.split('.');
        const integerPart = parts[0];
        const decimalPart = parts.length > 1 ? ',' + parts[1] : '';

        const formattedInteger = integerPart.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
        return formattedInteger + decimalPart;
      }

      function updateDisplay() {
        display.textContent = formatNumber(currentValue);

        // Fluid typography auto-scaling for viewport preservation
        const len = currentValue.length;
        if (len > 9) {
          display.className = 'text-headline-lg font-headline-lg text-on-surface tracking-tight text-right select-text';
        } else if (len > 6) {
          display.className = 'text-keypad-num font-keypad-num text-on-surface tracking-tight text-right select-text';
        } else {
          display.className = 'text-display-calc-mobile font-display-calc-mobile text-on-surface tracking-tighter text-right select-text';
        }

        clearBtn.textContent = currentValue === '0' ? 'AC' : 'C';
      }

      document.querySelectorAll('[data-num]').forEach(button => {
        button.addEventListener('click', () => {
          const digit = button.getAttribute('data-num');
          if (shouldResetDisplay) {
            currentValue = digit;
            shouldResetDisplay = false;
          } else {
            if (currentValue === '0') {
              currentValue = digit;
            } else if (currentValue.length < 12) {
              currentValue += digit;
            }
          }
          updateDisplay();
        });
      });

      document.querySelectorAll('[data-op]').forEach(button => {
        button.addEventListener('click', () => {
          const op = button.getAttribute('data-op');
          previousValue = currentValue;
          currentOperator = op;
          shouldResetDisplay = true;
          history.textContent = formatNumber(previousValue) + ' ' + currentOperator;
        });
      });

      document.getElementById('btn-comma').addEventListener('click', () => {
        if (shouldResetDisplay) {
          currentValue = '0.';
          shouldResetDisplay = false;
        } else if (!currentValue.includes('.')) {
          currentValue += '.';
        }
        updateDisplay();
      });

      clearBtn.addEventListener('click', () => {
        if (currentValue === '0') {
          previousValue = '';
          currentOperator = null;
          history.textContent = '';
        } else {
          currentValue = '0';
        }
        updateDisplay();
      });

      document.getElementById('btn-negate').addEventListener('click', () => {
        if (currentValue !== '0') {
          if (currentValue.startsWith('-')) {
            currentValue = currentValue.substring(1);
          } else {
            currentValue = '-' + currentValue;
          }
          updateDisplay();
        }
      });

      document.getElementById('btn-percent').addEventListener('click', () => {
        const num = parseFloat(currentValue);
        if (!isNaN(num)) {
          currentValue = String(num / 100);
          updateDisplay();
        }
      });

      document.getElementById('btn-backspace').addEventListener('click', () => {
        if (currentValue.length > 1) {
          currentValue = currentValue.slice(0, -1);
          if (currentValue === '-') currentValue = '0';
        } else {
          currentValue = '0';
        }
        updateDisplay();
      });

      document.getElementById('btn-equals').addEventListener('click', () => {
        if (!currentOperator || !previousValue) return;

        const prev = parseFloat(previousValue);
        const curr = parseFloat(currentValue);
        let result = 0;

        switch (currentOperator) {
          case '+':
            result = prev + curr;
            break;
          case '−':
            result = prev - curr;
            break;
          case '×':
            result = prev * curr;
            break;
          case '÷':
            result = curr !== 0 ? prev / curr : 'Erro';
            break;
        }

        history.textContent = formatNumber(previousValue) + ' ' + currentOperator + ' ' + formatNumber(currentValue) + ' =';
        currentValue = String(result);
        currentOperator = null;
        shouldResetDisplay = true;
        updateDisplay();
      });

      // Initial visual render
      updateDisplay();
    })();
  </script>
